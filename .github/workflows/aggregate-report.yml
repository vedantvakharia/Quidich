# Publish to GitHub Pages.
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.

name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer push supersede an in-flight publish, but don't cancel a run mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Assemble a small static site
      - name: Assemble Pages site
        run: |
          mkdir -p _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/deploy-pages@v4
